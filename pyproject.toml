[project]
name = "agente-contenido"
version = "0.1.0"
description = "El agente de contenido del curso Agentes 1 · Flujos agenticos avanzados"
requires-python = ">=3.12,<3.13"

# Versiones fijadas a proposito y leidas de PyPI el 2026-08-10 (informe 01).
# El motivo esta en CLAUDE.md: casi todo el material de LangChain que hay en
# internet es de la era 0.x y no funciona con estas.
dependencies = [
    "langchain==1.3.14",
    "langgraph==1.2.10",
    "langchain-openai==1.4.3",
    "rich==15.0.0",
    # Fijada el 2026-08-13, tras comprobar cual resolvio con las de arriba.
    "python-dotenv==1.2.2",
]
